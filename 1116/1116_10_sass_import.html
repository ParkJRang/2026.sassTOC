<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="./css/import.css" rel="stylesheet" type="text/css">
  <title>10_sass_import(외부파일 불러오기)</title>
</head>
<body>
  <h2>10_sass_import(외부파일 불러오기)</h2>
  <ul>
    <li>sass도 css처럼 @import구문을 지원, 다른 sass파일 불러올 수 있음</li>
    <li>css는 @import 사용할 때마다 http요청을 추가해서 작업을 하지만 sass는 css로 바로 처리하기 때문에 http호출이 불필요, '@import 불러올 sass 파일명;'</li>
    <li>파일을 불러올 때 확장자르 ㄹ지정할 필요 없음. sass에서는 당연히 '파일명.scss'를 가져온다고 가정하기 때문</li>
  </ul>
  <p>scss파일명에 '_'기호 붙이면 컴파일되지 않음</p>

  <div id="wrap">
    <h1>상단로고</h1>
  </div>
</body>
</html>
